<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc">
  <title id="title">First Cell onboarding path</title>
  <desc id="desc">Describe a module and Cell type, provision a Cell and start its owner, commit a command with a stable request identity, then read at the returned receipt.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25334b" stroke-width=".6"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8ea2bb"/></marker>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.title{font-size:19px;font-weight:700;fill:#f8fafc}.sub{font-size:11px;fill:#a8b8cc}.num{font-size:11px;font-weight:700;fill:#0f172a}.label{font-size:13px;font-weight:700;fill:#f8fafc}.detail{font-size:10px;fill:#c0ccdb}.edge{fill:none;stroke:#8ea2bb;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1060" height="300" rx="18" fill="#0f172a"/><rect width="1060" height="300" rx="18" fill="url(#grid)"/>
  <text x="28" y="39" class="title">From a Rust module to a durable read</text>
  <text x="28" y="60" class="sub">The examples below run locally with temporary SQLite files and an in-memory object store.</text>
  <path class="edge" d="M252 153H277"/><path class="edge" d="M505 153H530"/><path class="edge" d="M758 153H783"/>
  <rect x="28" y="94" width="224" height="126" rx="10" fill="#123b36" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="52" cy="117" r="13" fill="#34d399"/><text x="52" y="121" class="num" text-anchor="middle">1</text>
  <text x="72" y="123" class="label">Describe</text>
  <text x="44" y="158" class="detail">Register module + Cell type</text>
  <text x="44" y="179" class="detail">Compile stable descriptor</text>
  <text x="44" y="201" fill="#6ee7b7" font-size="9">basic.rs</text>
  <rect x="281" y="94" width="224" height="126" rx="10" fill="#18354b" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="305" cy="117" r="13" fill="#60a5fa"/><text x="305" y="121" class="num" text-anchor="middle">2</text>
  <text x="325" y="123" class="label">Start</text>
  <text x="297" y="158" class="detail">Provision catalog + owner</text>
  <text x="297" y="179" class="detail">Bootstrap managed Cell</text>
  <text x="297" y="201" fill="#93c5fd" font-size="9">sql.rs</text>
  <rect x="534" y="94" width="224" height="126" rx="10" fill="#382e50" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="558" cy="117" r="13" fill="#a78bfa"/><text x="558" y="121" class="num" text-anchor="middle">3</text>
  <text x="578" y="123" class="label">Commit</text>
  <text x="550" y="158" class="detail">Send typed SQL batch</text>
  <text x="550" y="179" class="detail">Get durable receipt</text>
  <text x="550" y="201" fill="#c4b5fd" font-size="9">sql.rs</text>
  <rect x="787" y="94" width="245" height="126" rx="10" fill="#4a351e" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="811" cy="117" r="13" fill="#fbbf24"/><text x="811" y="121" class="num" text-anchor="middle">4</text>
  <text x="831" y="123" class="label">Observe</text>
  <text x="803" y="158" class="detail">Query at that receipt</text>
  <text x="803" y="179" class="detail">Verify published value</text>
  <text x="803" y="201" fill="#fcd34d" font-size="9">sql.rs</text>
  <text x="28" y="267" class="sub">The Blob example follows the same receipt rule for an upload and read.</text>
</svg>
