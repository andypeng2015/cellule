<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
<title id="title">Cellule architecture and ownership</title>
<desc id="desc">A dark architecture diagram with three regions: application-owned ingress, domain, provider and credentials; embedded Cellule app, runtime, host and optional peer HTTP; and one Cell with a fenced owner, managed SQLite, LTX, authority and object storage. A final shelf lists SQL, KV, Blob, Queue, Cron, Workflow, Activities and Effects.</desc>
