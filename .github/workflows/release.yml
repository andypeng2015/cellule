name: Release Cellule

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cellule-crates-io-release
  cancel-in-progress: false

jobs:
  release_metadata:
    name: Validate release tag and source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
      - name: Require a versioned commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate SemVer and the matched crate set
        run: python3 scripts/release.py check --tag "$GITHUB_REF_NAME"

  verify:
    name: Run the complete Rust CI workflow
    uses: ./.github/workflows/rust.yml

  publish:
    name: Publish matched crates to crates.io
    needs: [release_metadata, verify]
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/users/forhappy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
      - name: Authenticate with crates.io trusted publishing
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: python3 scripts/release.py publish --tag "$GITHUB_REF_NAME"

  github_release:
    name: Create GitHub release
    needs: [release_metadata, verify, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
          else
            python3 scripts/release.py notes --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Cellule $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
