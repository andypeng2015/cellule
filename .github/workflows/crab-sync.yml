name: Crab capability synchronization

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      crab_revision:
        description: Crab revision to compare
        default: main
        required: true
        type: string

permissions:
  contents: read

jobs:
  capability-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: crabbuild/crab
          ref: ${{ inputs.crab_revision || (github.event_name == 'schedule' && 'main') || 'beb439039cb37e750afe6625a2358101c70d1191' }}
          path: .crab-sync-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Verify capability parity and framework adaptations
        run: python3 scripts/check-crab-sync.py --crab-source .crab-sync-source
